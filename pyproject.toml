[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pace"
version = "0.1.0"
description = "Project Automation and Configuration Engine - A Python CLI tool for bulk management of C# .NET project ecosystems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Noremac11800"}
]
keywords = ["dotnet", ".net", "cli", "project-management", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "tomli-w>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pyright>=1.1.0",
]

[project.scripts]
pace = "pace.cli:main"

[project.urls]
Homepage = "https://github.com/Noremac11800/PACE"
Repository = "https://github.com/Noremac11800/PACE"
Issues = "https://github.com/Noremac11800/PACE/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pace*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
