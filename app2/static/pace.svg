<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Gear / cog icon built from shapes — representing automation/configuration -->
<g transform="translate(50,50) scale(1.25) translate(-340,-118)">
    <!-- Outer ring -->
    <circle cx="340" cy="118" r="36" fill="none" stroke="#ffffff" stroke-width="2"
        style="fill:none;stroke:rgba(255,255,255,0.7);color:rgb(255, 255, 255);stroke-width:2.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;" />
    <circle cx="340" cy="118" r="36" fill="none" stroke="#ffffff" stroke-width="2"
        style="fill:none;stroke:rgb(255, 255, 255);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;" />
    <!-- Inner circle -->
    <circle cx="340" cy="118" r="18" fill="#ffffff" opacity="0.15"
        style="fill:rgb(255, 255, 255);stroke:rgba(255,255,255,0.35);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.15;" />
    <circle cx="340" cy="118" r="8" fill="#ffffff"
        style="fill:rgb(255, 255, 255);stroke:rgba(255,255,255,0.7);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;" />
    <!-- Gear teeth — 8 rectangles radiating outward -->
    <rect x="336" y="78" width="8" height="14" rx="2" fill="#ffffff"
        style="fill:rgb(255, 255, 255);stroke:rgba(255,255,255,0.7);stroke-width:1px;stroke-linecap:round;stroke-linejoin:round;opacity:1;" />
    <rect x="336" y="144" width="8" height="14" rx="2" fill="#ffffff"
        style="fill:rgb(255, 255, 255);stroke:rgba(255,255,255,0.7);stroke-width:1px;stroke-linecap:round;stroke-linejoin:round;opacity:1;" />
    <rect x="300" y="114" width="14" height="8" rx="2" fill="#ffffff"
        style="fill:rgb(255, 255, 255);stroke:rgba(255,255,255,0.7);stroke-width:1px;stroke-linecap:round;stroke-linejoin:round;opacity:1;" />
    <rect x="366" y="114" width="14" height="8" rx="2" fill="#ffffff"
        style="fill:rgb(255, 255, 255);stroke:rgba(255,255,255,0.7);stroke-width:1px;stroke-linecap:round;stroke-linejoin:round;opacity:1;" />

    <g transform="rotate(45, 340, 118)">
        <rect x="336" y="78" width="8" height="14" rx="2" fill="#ffffff"
            style="fill:rgb(255, 255, 255);stroke:rgba(255,255,255,0.7);stroke-width:1px;stroke-linecap:round;stroke-linejoin:round;opacity:1;" />
        <rect x="336" y="144" width="8" height="14" rx="2" fill="#ffffff"
            style="fill:rgb(255, 255, 255);stroke:rgba(255,255,255,0.7);stroke-width:1px;stroke-linecap:round;stroke-linejoin:round;opacity:1;" />
        <rect x="300" y="114" width="14" height="8" rx="2" fill="#ffffff"
            style="fill:rgb(255, 255, 255);stroke:rgba(255,255,255,0.7);stroke-width:1px;stroke-linecap:round;stroke-linejoin:round;opacity:1;" />
        <rect x="366" y="114" width="14" height="8" rx="2" fill="#ffffff"
            style="fill:rgb(255, 255, 255);stroke:rgba(255,255,255,0.7);stroke-width:1px;stroke-linecap:round;stroke-linejoin:round;opacity:1;" />
    </g>
</g>
</svg>
