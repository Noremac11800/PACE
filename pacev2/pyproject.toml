[project]
name = "pacev2"
version = "0.1.0"
description = "Typer CLI scaffold for the Project Automation and Configuration Engine"
readme = "README.md"
authors = [
    { name = "Cameron Kirk", email = "51150380+Noremac11800@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.5",
    "typer>=0.27.2",
]

[project.scripts]
pacev2 = "pacev2:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
