<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Gear / cog icon built from shapes — representing automation/configuration (dark mode version) -->
<g transform="translate(50,50) scale(1.25) translate(-340,-118)">
    <!-- Outer ring -->
    <circle cx="340" cy="118" r="36" fill="none" stroke="#1f2937" stroke-width="2"
        style="fill:none;stroke:rgba(31,41,55,0.8);color:rgb(31, 41, 55);stroke-width:2.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;" />
    <circle cx="340" cy="118" r="36" fill="none" stroke="#374151" stroke-width="2"
        style="fill:none;stroke:rgb(55, 65, 81);color:rgb(55, 65, 81);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;" />
    <!-- Inner circle -->
    <circle cx="340" cy="118" r="18" fill="#374151" opacity="0.2"
        style="fill:rgb(55, 65, 81);stroke:rgba(55,65,81,0.4);color:rgb(55, 65, 81);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.2;" />
    <circle cx="340" cy="118" r="8" fill="#6b7280"
        style="fill:rgb(107, 114, 128);stroke:rgba(107,114,128,0.8);color:rgb(107, 114, 128);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;" />
    <!-- Gear teeth — 8 rectangles radiating outward -->
    <rect x="336" y="78" width="8" height="14" rx="2" fill="#4b5563"
        style="fill:rgb(75, 85, 99);stroke:rgba(75,85,99,0.8);stroke-width:1px;stroke-linecap:round;stroke-linejoin:round;opacity:1;" />
    <rect x="336" y="144" width="8" height="14" rx="2" fill="#4b5563"
        style="fill:rgb(75, 85, 99);stroke:rgba(75,85,99,0.8);stroke-width:1px;stroke-linecap:round;stroke-linejoin:round;opacity:1;" />
    <rect x="300" y="114" width="14" height="8" rx="2" fill="#4b5563"
        style="fill:rgb(75, 85, 99);stroke:rgba(75,85,99,0.8);stroke-width:1px;stroke-linecap:round;stroke-linejoin:round;opacity:1;" />
    <rect x="366" y="114" width="14" height="8" rx="2" fill="#4b5563"
        style="fill:rgb(75, 85, 99);stroke:rgba(75,85,99,0.8);stroke-width:1px;stroke-linecap:round;stroke-linejoin:round;opacity:1;" />

    <g transform="rotate(45, 340, 118)">
        <rect x="336" y="78" width="8" height="14" rx="2" fill="#4b5563"
            style="fill:rgb(75, 85, 99);stroke:rgba(75,85,99,0.8);stroke-width:1px;stroke-linecap:round;stroke-linejoin:round;opacity:1;" />
        <rect x="336" y="144" width="8" height="14" rx="2" fill="#4b5563"
            style="fill:rgb(75, 85, 99);stroke:rgba(75,85,99,0.8);stroke-width:1px;stroke-linecap:round;stroke-linejoin:round;opacity:1;" />
        <rect x="300" y="114" width="14" height="8" rx="2" fill="#4b5563"
            style="fill:rgb(75, 85, 99);stroke:rgba(75,85,99,0.8);stroke-width:1px;stroke-linecap:round;stroke-linejoin:round;opacity:1;" />
        <rect x="366" y="114" width="14" height="8" rx="2" fill="#4b5563"
            style="fill:rgb(75, 85, 99);stroke:rgba(75,85,99,0.8);stroke-width:1px;stroke-linecap:round;stroke-linejoin:round;opacity:1;" />
    </g>
</g>
</svg>
